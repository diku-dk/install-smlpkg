on: [push]

jobs:
  test_job:
    runs-on: ubuntu-latest
    name: Test installation.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3

      - id: install-version
        uses: diku-dk/install-smlpkg@HEAD
        with:
          version: '0.1.5'
      - id: install-no-version
        uses: diku-dk/install-smlpkg@HEAD
      - id: install-latest
        uses: diku-dk/install-smlpkg@HEAD
        with:
          version: 'latest'

      - run: smlpkg --help
