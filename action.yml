name: 'Install smlpkg'
description: 'Installs the smlpkg package manager'
inputs:
  version:
    description: 'Version to install (or "latest")'
    required: false
    default: 'latest'
runs:
  using: "composite"
  steps:
    - id: fetch
      uses: dsaltares/fetch-gh-release-asset@1.1.0
      with:
        repo: 'diku-dk/smlpkg'
        version: ${{ ((inputs.version == 'latest') && 'latest') || format('tags/v{0}', inputs.version) }}
        regex: true
        file: "smlpkg-bin-dist-linux.tgz"
        target: 'smlpkg-install-dir/'
    - id: install
      shell: bash
      working-directory: 'smlpkg-install-dir/'
      run: |
        tar xvf smlpkg-bin-dist-linux.tgz
        mkdir -p $HOME/.local/bin
        make -C smlpkg-bin-dist-linux install PREFIX=$HOME/.local
    - id: cleanup
      shell: bash
      run: rm -rf smlpkg-install-dir
    - id: report
      shell: bash
      run: smlpkg --version
